<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜡染AI创作工坊 · BatikScript</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#1a3a5c;
  --indigo-light:#2c5282;
  --indigo-dark:#0f1e36;
  --cream:#f7f3e9;
  --paper:#f5f0e8;
  --earth:#e8dcc4;
  --ink:#2a2a28;
  --muted:#8a8578;
  --line:#e3dccd;
  --bg-soft:#faf7f1;
  --ok:#3d7a4a;
  --err:#b3413a;
  --font-sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:'Noto Serif SC',Georgia,'Songti SC',SimSun,serif;
  --font-mono:'JetBrains Mono','IBM Plex Mono',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg-soft);color:var(--ink);overflow:hidden}
#app{display:flex;height:100vh;width:100vw}

/* ============ 左栏 ============ */
.left{width:40%;min-width:400px;max-width:560px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--cream)}
.brand-logo{width:34px;height:34px;border-radius:9px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:17px;flex:none}
.brand h1{font-family:var(--font-serif);font-size:15px;font-weight:700;color:var(--indigo)}
.brand p{font-size:10px;color:var(--muted);margin-top:1px;letter-spacing:.4px}

/* 对话 */
.chat{height:54%;display:flex;flex-direction:column;border-bottom:1px solid var(--line);min-height:240px}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.panel-head .chip{font-size:10px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;max-width:88%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .bubble{border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.65}
.msg.user .bubble{background:var(--indigo);color:#fff;border-bottom-right-radius:3px}
.msg.ai .bubble{background:#f1ede3;color:var(--ink);border-bottom-left-radius:3px}
.msg .bubble .ai-code{display:block;background:var(--indigo-dark);color:#7dd3a8;font-family:var(--font-mono);font-size:11px;line-height:1.55;padding:9px 11px;border-radius:8px;margin:7px 0 3px;overflow-x:auto;white-space:pre}
.msg .bubble .ai-inline{background:rgba(26,58,92,.09);font-family:var(--font-mono);font-size:11.5px;padding:1px 5px;border-radius:4px;color:var(--indigo)}
.msg .bubble .craft{background:rgba(26,58,92,.07);border-left:3px solid var(--indigo);padding:7px 9px;border-radius:0 6px 6px 0;font-size:11.5px;color:#5d5a4f;margin-top:8px}
.msg .bubble .craft b{color:var(--indigo);font-weight:600}
.msg.ai .bubble.fading{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.chat-input-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fff}
.chat-input-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;font-family:var(--font-sans);outline:none;transition:border-color .15s}
.chat-input-row input:focus{border-color:var(--indigo)}
.chat-input-row input:disabled{background:#f2efe7;color:var(--muted)}
.send-btn{width:38px;height:38px;border:none;border-radius:9px;background:var(--indigo);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex:none}
.send-btn:hover{background:var(--indigo-light)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}

/* 语法面板 */
.syntax{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fdfbf7}
.tabs button{flex:1;padding:11px 4px;border:none;background:none;font-size:12.5px;font-family:var(--font-sans);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;transition:color .15s}
.tabs button.on{color:var(--indigo);border-bottom-color:var(--indigo);font-weight:600}
.tab-panel{flex:1;overflow-y:auto;min-height:0}
.tab-panel.hidden{display:none}

/* 语法手册 */
.manual{padding:14px 16px}
.manual .cat{margin-bottom:14px}
.manual .cat h4{font-size:12px;font-weight:700;color:var(--indigo);margin-bottom:8px;letter-spacing:.5px}
.manual .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg-soft);cursor:help;transition:border-color .15s,box-shadow .15s}
.manual .item:hover{border-color:rgba(26,58,92,.4);box-shadow:0 2px 8px rgba(26,58,92,.06)}
.manual .item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.manual .item .name{font-size:13px;font-weight:600}
.manual .item .params{font-size:11px;color:var(--muted)}
.manual .item pre{background:rgba(26,58,92,.06);border-radius:6px;padding:7px 9px;font-family:var(--font-mono);font-size:11px;color:#3c3a33;margin-top:6px;overflow-x:auto;white-space:pre}
.tip{position:fixed;z-index:999;max-width:300px;background:var(--indigo-dark);color:#eae6da;font-size:12px;line-height:1.6;padding:10px 12px;border-radius:9px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.tip.show{display:block}

/* 当前代码 */
.code-wrap{display:flex;flex-direction:column;height:100%}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)}
.code-status{display:flex;align-items:center;gap:7px;font-size:11px}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:rgba(61,122,74,.35);background:rgba(61,122,74,.06)}
.badge.err{color:var(--err);border-color:rgba(179,65,58,.35);background:rgba(179,65,58,.06)}
.code-hint{font-size:10.5px;color:var(--muted)}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:5px;border-radius:6px;transition:background .15s,color .15s}
.icon-btn:hover{background:#f0ece1;color:var(--indigo)}
#code-editor{flex:1;width:100%;resize:none;border:none;outline:none;background:var(--indigo-dark);color:#9fe0b8;font-family:var(--font-mono);font-size:12px;line-height:1.7;padding:13px 14px;white-space:pre;tab-size:2}
.code-err{background:rgba(179,65,58,.07);border-top:1px solid rgba(179,65,58,.2);color:var(--err);font-size:11px;padding:7px 12px}

/* 历史 */
.history{padding:12px 16px}
.history .empty{text-align:center;color:var(--muted);padding:36px 0;font-size:12px;line-height:2}
.hist-item{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--bg-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hist-item .meta{min-width:0}
.hist-item .time{font-size:10.5px;color:var(--muted)}
.hist-item .sum{font-size:12px;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .restore{border:1px solid var(--line);background:#fff;color:var(--indigo);font-size:11px;padding:4px 9px;border-radius:7px;cursor:pointer;flex:none;transition:background .15s}
.hist-item .restore:hover{background:var(--indigo);color:#fff;border-color:var(--indigo)}

/* ============ 右栏 ============ */
.right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-soft)}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
.toolbar .grp{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12.5px;font-family:var(--font-sans);padding:7px 12px;border-radius:8px;cursor:pointer;transition:all .15s}
.btn:hover{background:#f6f2e9}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo-light)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.layer-count{font-size:11.5px;color:var(--muted)}
.dropdown{position:relative}
.menu{position:fixed;z-index:900;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;display:none}
.menu.show{display:block}
.menu .mi{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:12.5px;border-radius:7px;cursor:pointer;color:var(--ink)}
.menu .mi:hover{background:#f4f0e6}
.menu .mi.danger{color:var(--err)}
.menu .mi.danger:hover{background:rgba(179,65,58,.07)}

.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, rgba(26,58,92,.05) 1px, transparent 0) 0 0/22px 22px}
.canvas-wrap{position:relative;box-shadow:0 12px 40px rgba(26,58,92,.18);border-radius:4px;line-height:0;background:#fff}
#batik-canvas{display:block;width:100%;height:auto;max-width:640px;border-radius:4px;cursor:crosshair}
#selection{position:absolute;border:2px solid rgba(26,58,92,.75);pointer-events:none;display:none;z-index:5}
#selection .dot{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--indigo);border-radius:3px;transform:translate(-50%,-50%)}
#empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#empty-hint .icon{width:64px;height:64px;border-radius:50%;background:rgba(26,58,92,.08);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
#empty-hint p{font-size:14px;font-weight:500;color:rgba(26,58,92,.55)}
#empty-hint span{font-size:11.5px;color:var(--muted);margin-top:6px}

/* 播放控制 */
.playback{display:none;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--line);background:#fff}
.playback.show{display:flex}
.play-btn{width:38px;height:38px;border:none;border-radius:50%;background:var(--indigo);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex:none}
.play-btn:hover{background:var(--indigo-light)}
.anim-label{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between}
.slider{flex:1;min-width:120px}
.slider input[type=range]{width:100%;accent-color:var(--indigo);cursor:pointer}
.loop-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.switch{position:relative;width:34px;height:19px;border-radius:99px;background:#d8d2c4;cursor:pointer;transition:background .18s;flex:none;border:none}
.switch.on{background:var(--indigo)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on::after{left:17px}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--indigo-dark);color:#eee9dd;font-size:12.5px;padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:1000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* 右键菜单 */
#ctx-menu{position:fixed;z-index:950;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:5px;display:none}
#ctx-menu.show{display:block}
#ctx-menu .mi{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:12.5px;border-radius:7px;cursor:pointer}
#ctx-menu .mi:hover{background:#f4f0e6}
#ctx-menu .mi.danger{color:var(--err)}

@media (max-width:900px){
  #app{flex-direction:column;overflow-y:auto}
  .left{width:100%;max-width:none;min-width:0;height:58vh;border-right:none;border-bottom:1px solid var(--line)}
  .right{min-height:60vh}
  .chat{height:52%}
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 左栏 ============ -->
  <aside class="left">
    <div class="brand">
      <div class="brand-logo">蜡</div>
      <div>
        <h1>蜡染AI创作工坊</h1>
        <p>BatikScript · 非遗技艺 · 语法驱动创作</p>
      </div>
    </div>

    <!-- AI 对话 -->
    <section class="chat">
      <div class="panel-head">
        <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L19.6 10l-5.7 1.9L12 17.6l-1.9-5.7L4.4 10l5.7-1.3z"/></svg>蜡染AI对话</h3>
        <span class="chip">BatikScript</span>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="描述你想要的蜡染效果，如“加冰裂纹、染深一点”" autocomplete="off">
        <button class="send-btn" id="send-btn" title="发送"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
    </section>

    <!-- 语法面板 -->
    <section class="syntax">
      <div class="tabs">
        <button class="on" data-tab="manual"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>语法手册</button>
        <button data-tab="code"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>当前代码</button>
        <button data-tab="history"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>历史版本</button>
      </div>

      <!-- 语法手册 -->
      <div class="tab-panel" id="panel-manual"><div class="manual" id="manual-box"></div></div>

      <!-- 当前代码 -->
      <div class="tab-panel hidden" id="panel-code">
        <div class="code-wrap">
          <div class="code-head">
            <div class="code-status">
              <span class="badge ok" id="code-badge">语法正确</span>
              <span class="code-hint">Ctrl/⌘+S 应用到画布</span>
            </div>
            <button class="icon-btn" id="copy-code-btn" title="复制代码"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
          </div>
          <textarea id="code-editor" spellcheck="false" autocomplete="off"></textarea>
          <div class="code-err" id="code-err" style="display:none"></div>
        </div>
      </div>

      <!-- 历史版本 -->
      <div class="tab-panel hidden" id="panel-history"><div class="history" id="history-box"></div></div>
    </section>
  </aside>

  <!-- ============ 右栏 ============ -->
  <main class="right">
    <div class="toolbar">
      <div class="grp">
        <button class="btn primary" id="upload-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传图片</button>
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/jpg,image/webp" multiple style="display:none">
        <div class="dropdown">
          <button class="btn" id="sample-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>示例图案 ▾</button>
        </div>
        <span class="layer-count" id="layer-count">0/3 图层</span>
      </div>
      <div class="grp">
        <button class="btn" id="reset-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>重置画布</button>
        <button class="btn" id="export-img-btn" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出图片</button>
        <div class="dropdown">
          <button class="btn" id="code-drop-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>导出代码 ▾</button>
        </div>
      </div>
    </div>

    <div class="canvas-area">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="batik-canvas" width="600" height="600"></canvas>
        <div id="selection"><div class="dot" style="left:0;top:0"></div><div class="dot" style="left:100%;top:0"></div><div class="dot" style="left:0;top:100%"></div><div class="dot" style="left:100%;top:100%"></div></div>
        <div id="empty-hint">
          <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="rgba(26,58,92,.55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <p>上传蜡染图片开始创作</p>
          <span>支持 PNG / JPG，最多 3 张 · 拖拽移动 · 右键图层操作</span>
        </div>
      </div>
    </div>

    <div class="playback" id="playback">
      <button class="play-btn" id="play-btn"><svg id="play-icon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
      <button class="icon-btn" id="restart-btn" title="回到起始帧" style="width:30px;height:30px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg></button>
      <div class="slider">
        <div class="anim-label"><span id="anim-name">浸染动画</span><span id="anim-pct">0%</span></div>
        <input type="range" id="progress" min="0" max="100" value="100">
      </div>
      <div class="loop-row">
        <button class="switch" id="loop-switch" role="switch" aria-checked="false"></button>
        <span>循环</span>
      </div>
      <button class="btn" id="screenshot-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>截屏</button>
    </div>
  </main>
</div>

<div class="tip" id="tip"></div>

/* ---------- 语法手册数据 ---------- */
const SYNTAX_ITEMS = [
  { id:'1', name:'图层', category:'layer', params:['序号（1-3）','素材','位置','大小','旋转'], example:'图层[1] {\n  素材: "图案A";\n  位置: 100, 200;\n  大小: 300, 400;\n  旋转: 15;\n}', craftExplain:'对应传统蜡染中的一层蜡或一层染，多层叠加形成丰富效果。蜡染作品通常需要多次画蜡、多次浸染才能完成。' },
  { id:'2', name:'画蜡笔触', category:'effect', params:['数值（1-20）'], example:'画蜡笔触: 8;', craftExplain:'模拟铜刀（蜡刀）画蜡的笔触粗细。传统蜡染使用铜制蜡刀蘸熔蜡作画，不同粗细的蜡刀产生不同的线条效果。' },
  { id:'3', name:'点蜡密度', category:'effect', params:['百分比（0-100）'], example:'点蜡密度: 60;', craftExplain:'点蜡技法的疏密程度。点蜡是蜡染基本技法之一，用蜡刀点出圆点组成图案，疏密变化产生层次感。' },
  { id:'4', name:'浸染深度', category:'effect', params:['数值（0-100）'], example:'浸染深度: 75;', craftExplain:'靛蓝浸染的深浅程度。传统蜡染使用蓝草发酵的靛蓝染料，浸染次数越多、时间越长，颜色越深。' },
  { id:'5', name:'冰裂纹', category:'effect', params:['开启/关闭'], example:'冰裂纹: 开启;', craftExplain:'蜡染标志性的“冰纹”效果。染制过程中蜡层龟裂，染料渗入裂缝形成自然纹理，每一件作品的冰纹都独一无二。' },
  { id:'6', name:'冰裂纹粗细', category:'effect', params:['数值（1-10）'], example:'冰裂纹粗细: 4;', craftExplain:'冰裂纹的粗细程度。蜡层越厚、折叠力度越大，产生的裂纹越粗。不同粗细的冰纹呈现不同的质感。' },
  { id:'7', name:'冰裂纹密度', category:'effect', params:['数值（1-100）'], example:'冰裂纹密度: 50;', craftExplain:'冰裂纹的分布密度。蜡层龟裂的密集程度，与布料折叠方式、蜡的脆度有关。苗族蜡染中冰纹被视为作品的灵魂。' },

  { id:'9', name:'融合模式', category:'effect', params:['叠印/拼接/螺旋/交织'], example:'融合模式: 叠印;', craftExplain:'多层蜡染的组合方式。传统蜡染通过多次画蜡多次浸染实现多层效果，叠印是最常见的方式，上层镂空透出下层颜色。' },
  { id:'10', name:'透明度', category:'effect', params:['数值（0-100）'], example:'透明度: 80;', craftExplain:'蜡层的透明程度。蜡层的厚薄影响染料渗透量，蜡越厚防染效果越好，蜡越薄则部分染料可渗入，产生半透明效果。' },

  { id:'12', name:'画布底色', category:'global', params:['靛蓝/本白/土黄'], example:'画布底色: 土黄;', craftExplain:'土布底色模拟。传统蜡染使用手工纺织的土棉布，本色为米黄色或本白色，染后留白部分呈现布料原色。' },
];

/* ---------- 状态 ---------- */
let layers = [];
let globalConfig = { ...DEFAULT_GLOBAL };
let currentCode = '';
let selectedLayerId = null;
let codeHistory = [];
let codeError = null;
let isPlaying = false;
let animationProgress = 1;
let raf = null;
let isSyncingFromCode = false;
let dragging = null;
let loadedImages = {};
let textureCanvas = null;

/* ---------- 工具函数 ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function parseNum(v){ const n = parseFloat(String(v).trim()); return isNaN(n) ? 0 : n; }
function parseBool(v){ const s = String(v).trim().toLowerCase(); return ['开启','true','1','是','on'].includes(s); }
function parsePair(v){ const p = String(v).split(/[,，]/).map(s => parseFloat(s.trim())); return [isNaN(p[0])?0:p[0], isNaN(p[1])?0:p[1]]; }
function fmtTime(ts){ const d = new Date(ts); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':'); }

/* ============================================================
 * BatikScript 解析器 / 生成器
 * ============================================================ */
function parseBlockProps(block){
  const props = [];
  const lines = block.split(/[;；\n]/);
  for (const line of lines){
    const t = line.trim();
    if (!t) continue;
    const m = t.match(/^([^:：]+)[:：](.*)$/);
    if (m) props.push([m[1].trim(), m[2].trim()]);
  }
  return props;
}

function parseBatikScript(code, existing){
  const errors = [];
  const parsedLayers = [];
  let parsedGlobal = { ...DEFAULT_GLOBAL };
  const clean = code.split('\n').map(l => { const i = l.indexOf('//'); return i >= 0 ? l.slice(0, i) : l; }).join('\n');
  const re = /图层\s*\[?(\d+)\]?\s*\{([\s\S]*?)\}/g;
  let m;
  while ((m = re.exec(clean)) !== null){
    const index = parseInt(m[1], 10);
    const block = m[2];
    const props = parseBlockProps(block);
    const prev = (existing || []).find(l => l.index === index);
    const fx = { ...(prev ? prev.effects : DEFAULT_EFFECTS) };
    let x = prev ? prev.x : 50, y = prev ? prev.y : 50;
    let w = prev ? prev.width : 220, h = prev ? prev.height : 220;
    let rot = prev ? prev.rotation : 0;
    let imageSrc = prev ? prev.imageSrc : '', name = prev ? prev.name : '图层' + index, imageId = prev ? prev.imageId : 'img' + index;
    for (const [k, v] of props){
      switch (k){
        case '素材': name = String(v).replace(/^["']|["']$/g,'').trim(); imageId = name; break;
        case '位置': { const [a,b] = parsePair(v); x = a; y = b; break; }
        case '大小': { const [a,b] = parsePair(v); w = a; h = b; break; }
        case '旋转': rot = parseNum(v); break;
        case '画蜡笔触': fx.strokeWidth = clamp(parseNum(v), 1, 20); break;
        case '点蜡密度': fx.dotDensity = clamp(parseNum(v), 0, 100); break;
        case '浸染深度': fx.dyeDepth = clamp(parseNum(v), 0, 100); break;
        case '冰裂纹': fx.iceCrack = parseBool(v); break;
        case '冰裂纹粗细': fx.iceCrackWidth = clamp(parseNum(v), 1, 10); break;
        case '冰裂纹密度': fx.iceCrackDensity = clamp(parseNum(v), 1, 100); break;
        case '晕染程度': fx.blurAmount = clamp(parseNum(v), 0, 20); break;
        case '融合模式': if (BLEND_MODES.includes(String(v).trim())) fx.blendMode = String(v).trim(); break;
        case '透明度': fx.opacity = clamp(parseNum(v), 0, 100); break;
      }
    }
    parsedLayers.push({ id: prev ? prev.id : 'layer-' + Date.now() + '-' + index, index, imageId, imageSrc, name, x, y, width: w, height: h, rotation: rot, zIndex: prev ? prev.zIndex : index, effects: fx });
  }
  const gm = clean.match(/全局\s*\{([\s\S]*?)\}/);
  if (gm){
    for (const [k, v] of parseBlockProps(gm[1])){
      const val = String(v).trim();
      switch (k){
        case '动画': if (ANIM_TYPES.includes(val)) parsedGlobal.animation = val; break;
        case '动画速度': parsedGlobal.animationSpeed = clamp(parseNum(v), 1, 10); break;
        case '动画循环': parsedGlobal.animationLoop = parseBool(v); break;
        case '画布底色': if (BG_TYPES.includes(val)) parsedGlobal.canvasBg = val; break;
      }
    }
  }
  if (parsedLayers.length === 0 && !gm) errors.push('未识别到有效的图层或全局配置，请检查语法');
  parsedLayers.sort((a,b) => a.index - b.index);
  return { layers: parsedLayers, globalConfig: parsedGlobal, errors };
}

function generateBatikCode(ls, gc){
  const out = [];
  out.push('// 蜡染AI创作工坊 · BatikScript');
  out.push('// 基于传统蜡染工艺语法，全中文关键字');
  out.push('');
  ls.forEach(layer => {
    out.push('图层[' + layer.index + '] {');
    out.push('  素材: "' + layer.name + '";');
    out.push('  位置: ' + Math.round(layer.x) + ', ' + Math.round(layer.y) + ';');
    out.push('  大小: ' + Math.round(layer.width) + ', ' + Math.round(layer.height) + ';');
    out.push('  旋转: ' + Math.round(layer.rotation) + ';');
    out.push('');
    out.push('  // 蜡染效果');
    out.push('  画蜡笔触: ' + layer.effects.strokeWidth + ';');
    out.push('  点蜡密度: ' + layer.effects.dotDensity + ';');
    out.push('  浸染深度: ' + layer.effects.dyeDepth + ';');
    out.push('  冰裂纹: ' + (layer.effects.iceCrack ? '开启' : '关闭') + ';');
    out.push('  冰裂纹粗细: ' + layer.effects.iceCrackWidth + ';');
    out.push('  冰裂纹密度: ' + layer.effects.iceCrackDensity + ';');
    out.push('  晕染程度: ' + layer.effects.blurAmount + ';');
    out.push('  融合模式: ' + layer.effects.blendMode + ';');
    out.push('  透明度: ' + layer.effects.opacity + ';');
    out.push('}');
    out.push('');
  });
  out.push('全局 {');
  out.push('  动画: ' + gc.animation + ';');
  out.push('  动画速度: ' + gc.animationSpeed + ';');
  out.push('  动画循环: ' + (gc.animationLoop ? '开启' : '关闭') + ';');
  out.push('  画布底色: ' + gc.canvasBg + ';');
  out.push('}');
  return out.join('\n');
}

function getDefaultCode(){
  return '// 蜡染AI创作工坊 · 欢迎使用 BatikScript\n// 上传图片后，AI 将自动生成对应代码\n// 你也可以直接编辑代码，画布实时同步效果\n\n全局 {\n  动画: 无;\n  动画速度: 5;\n  动画循环: 关闭;\n  画布底色: 土黄;\n}\n';
}

/* ============================================================
 * 蜡染效果渲染
 * ============================================================ */
function ensureTexture(){
  if (textureCanvas) return textureCanvas;
  const c = document.createElement('canvas'); c.width = CANVAS_W; c.height = CANVAS_H;
  const g = c.getContext('2d');
  for (let x = 0; x < CANVAS_W; x += 4){ g.strokeStyle = 'rgba(120,100,70,0.045)'; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, CANVAS_H); g.stroke(); }
  for (let y = 0; y < CANVAS_H; y += 4){ g.strokeStyle = 'rgba(120,100,70,0.045)'; g.beginPath(); g.moveTo(0, y); g.lineTo(CANVAS_W, y); g.stroke(); }
  for (let i = 0; i < 5000; i++){ g.fillStyle = 'rgba(90,75,55,' + (0.015 + Math.random() * 0.035).toFixed(3) + ')'; g.fillRect(Math.random() * CANVAS_W, Math.random() * CANVAS_H, 1.3, 1.3); }
  textureCanvas = c;
  return c;
}

function drawCrackBranch(g, x, y, angle, length, depth, maxDepth){
  if (depth >= maxDepth || length < 8) return;
  const ex = x + Math.cos(angle) * length, ey = y + Math.sin(angle) * length;
  g.beginPath(); g.moveTo(x, y);
  const mx = (x + ex) / 2 + (Math.random() - 0.5) * length * 0.2;
  const my = (y + ey) / 2 + (Math.random() - 0.5) * length * 0.2;
  g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
  const ba = 0.4 + Math.random() * 0.5;
  const bl = length * (0.5 + Math.random() * 0.3);
  drawCrackBranch(g, ex, ey, angle - ba, bl, depth + 1, maxDepth);
  drawCrackBranch(g, ex, ey, angle + ba, bl * 0.8, depth + 1, maxDepth);
}

function generateIceCrackTexture(w, h, crackWidth, density){
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.floor(w)); c.height = Math.max(1, Math.floor(h));
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(10,25,45,0.55)';
  g.lineWidth = Math.max(0.5, crackWidth * 0.5);
  g.lineCap = 'round';
  const n = Math.floor((density / 100) * 30) + 3;
  for (let i = 0; i < n; i++){
    drawCrackBranch(g, Math.random() * w, Math.random() * h, Math.random() * Math.PI * 2, 20 + Math.random() * 70, 0, 4);
  }
  return c;
}

function renderLayer(img, fx, x, y, w, h, rot, isTop, hasBelow){
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(rot * Math.PI / 180);
  ctx.translate(-w / 2, -h / 2);

  let dyeMult = 1, crackMult = 1, blendMult = 1;
  if (globalConfig.animation === '浸染') dyeMult = animationProgress;
  else if (globalConfig.animation === '冰裂蔓延') crackMult = animationProgress;
  else if (globalConfig.animation === '图案融合' && hasBelow) blendMult = animationProgress;

  ctx.globalAlpha = (fx.opacity / 100) * blendMult;

  const ow = Math.max(1, Math.floor(w)), oh = Math.max(1, Math.floor(h));
  const off = document.createElement('canvas'); off.width = ow; off.height = oh;
  const g = off.getContext('2d');
  g.drawImage(img, 0, 0, ow, oh);

  if (fx.blurAmount > 0){
    g.filter = 'blur(' + (fx.blurAmount * 0.3).toFixed(1) + 'px)';
    const tmp = document.createElement('canvas'); tmp.width = ow; tmp.height = oh;
    tmp.getContext('2d').drawImage(off, 0, 0);
    g.filter = 'none'; g.clearRect(0, 0, ow, oh); g.drawImage(tmp, 0, 0);
  }

  if (fx.dyeDepth > 0 && dyeMult > 0){
    const depth = (fx.dyeDepth / 100) * dyeMult;
    try {
      const id = g.getImageData(0, 0, ow, oh), d = id.data;
      for (let i = 0; i < d.length; i += 4){
        const br = (d[i] + d[i+1] + d[i+2]) / 3 / 255;
        const dr = 26 + br * 20, dg = 58 + br * 30, db = 92 + br * 40;
        d[i]   = Math.round(d[i]   * (1 - depth) + dr * depth);
        d[i+1] = Math.round(d[i+1] * (1 - depth) + dg * depth);
        d[i+2] = Math.round(d[i+2] * (1 - depth) + db * depth);
      }
      g.putImageData(id, 0, 0);
    } catch(e){ /* 忽略跨域限制场景 */ }
  }

  if (fx.dotDensity > 0){
    g.save();
    g.globalAlpha = 0.09 * (fx.dotDensity / 100);
    g.fillStyle = '#ffffff';
    const n = Math.floor((fx.dotDensity / 100) * 42);
    for (let i = 0; i < n; i++){
      g.beginPath(); g.arc(Math.random() * ow, Math.random() * oh, 1 + Math.random() * 2.4, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  if (fx.strokeWidth > 0){
    g.save();
    g.globalAlpha = 0.045 * (fx.strokeWidth / 20);
    g.strokeStyle = '#ffffff';
    g.lineWidth = Math.max(0.5, fx.strokeWidth * 0.15);
    const seed = fx.strokeWidth * 137;
    for (let i = 0; i < 14; i++){
      const sx = (Math.sin(seed + i * 0.7) * 0.5 + 0.5) * ow;
      const sy = (Math.cos(seed + i * 1.3) * 0.5 + 0.5) * oh;
      const ex = (Math.sin(seed + i * 2.1) * 0.5 + 0.5) * ow;
      const ey = (Math.cos(seed + i * 1.7) * 0.5 + 0.5) * oh;
      g.beginPath(); g.moveTo(sx, sy);
      g.quadraticCurveTo((sx+ex)/2 + (Math.random()-0.5)*ow*0.2, (sy+ey)/2 + (Math.random()-0.5)*oh*0.2, ex, ey);
      g.stroke();
    }
    g.restore();
  }

  if (fx.iceCrack && fx.iceCrackDensity > 0 && crackMult > 0){
    g.drawImage(generateIceCrackTexture(ow, oh, fx.iceCrackWidth, fx.iceCrackDensity * crackMult), 0, 0);
  }

  switch (fx.blendMode){
    case '叠印': ctx.globalCompositeOperation = 'multiply'; break;
    case '拼接': ctx.globalCompositeOperation = 'source-over'; break;
    case '螺旋':
    case '交织': ctx.globalCompositeOperation = 'overlay'; break;
    default: ctx.globalCompositeOperation = 'source-over';
  }
  ctx.drawImage(off, 0, 0, w, h);
  ctx.restore();
}

function renderCanvas(){
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.fillStyle = BG_COLORS[globalConfig.canvasBg] || BG_COLORS['土黄'];
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.globalAlpha = 0.5;
  ctx.drawImage(ensureTexture(), 0, 0, CANVAS_W, CANVAS_H);
  ctx.globalAlpha = 1;

  const sorted = [...layers].sort((a,b) => a.zIndex - b.zIndex);
  sorted.forEach((layer, i) => {
    const img = loadedImages[layer.id];
    if (!img || !layer.imageSrc) return;
    renderLayer(img, layer.effects, layer.x, layer.y, layer.width, layer.height, layer.rotation, i === sorted.length - 1, sorted.length > 1);
  });

  // 选中框
  const sel = layers.find(l => l.id === selectedLayerId);
  if (sel && sel.imageSrc){
    selectionEl.style.display = 'block';
    selectionEl.style.left = (sel.x / CANVAS_W * 100) + '%';
    selectionEl.style.top = (sel.y / CANVAS_H * 100) + '%';
    selectionEl.style.width = (sel.width / CANVAS_W * 100) + '%';
    selectionEl.style.height = (sel.height / CANVAS_H * 100) + '%';
    selectionEl.style.transform = 'rotate(' + sel.rotation + 'deg)';
    selectionEl.style.transformOrigin = 'center center';
  } else {
    selectionEl.style.display = 'none';
  }

  emptyHint.style.display = layers.length ? 'none' : 'flex';
  layerCountEl.textContent = layers.length + '/3 图层';
  $('export-img-btn').disabled = layers.length === 0;
  updatePlaybackUI();
}

/* ============================================================
 * 图层操作
 * ============================================================ */
function loadImageForLayer(layer){
  const img = new Image();
  img.onload = () => { loadedImages[layer.id] = img; renderCanvas(); };
  img.onerror = () => { toast('图片加载失败：' + layer.name); };
  img.src = layer.imageSrc;
}

function addLayerFromSrc(src, name, cb){
  const img = new Image();
  img.onload = () => {
    if (layers.length >= MAX_LAYERS){ toast('最多上传 ' + MAX_LAYERS + ' 张蜡染素材'); return; }
    const index = layers.length + 1;
    const maxSize = 260;
    let w = img.width, h = img.height;
    if (w > h){ if (w > maxSize){ h = (h / w) * maxSize; w = maxSize; } }
    else { if (h > maxSize){ w = (w / h) * maxSize; h = maxSize; } }
    const layer = {
      id: 'layer-' + Date.now() + '-' + Math.floor(Math.random()*1e4),
      index,
      imageId: '图片' + index,
      imageSrc: src,
      name: name || ('图片' + index),
      x: 40 + (index - 1) * 42,
      y: 40 + (index - 1) * 42,
      width: Math.round(w), height: Math.round(h),
      rotation: 0,
      zIndex: index,
      effects: { ...DEFAULT_EFFECTS }
    };
    layers.push(layer);
    loadImageForLayer(layer);
    syncCodeFromState('上传素材：' + layer.name);
    renderCanvas();
    toast('已添加「' + layer.name + '」');
    if (cb) cb();
  };
  img.onerror = () => toast('无法读取图片，请换一张试试');
  img.src = src;
}

function handleFiles(files){
  const arr = Array.from(files).filter(f => ['image/png','image/jpeg','image/jpg','image/webp'].includes(f.type));
  if (!arr.length){ toast('请上传 PNG / JPG / WebP 格式的图片'); return; }
  if (layers.length + arr.length > MAX_LAYERS){ toast('最多同时支持 ' + MAX_LAYERS + ' 张蜡染图片'); return; }
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => addLayerFromSrc(e.target.result, f.name.replace(/\.[^.]+$/, ''));
    reader.readAsDataURL(f);
  });
  fileInput.value = '';
}

function loadSample(idx){
  if (layers.length >= MAX_LAYERS){ toast('画布已满，最多 3 张素材'); return; }
  addLayerFromSrc(SAMPLE_IMAGES[idx], '内置示例' + (idx + 1));
}

/* ---------- 图层操作（右键菜单） ---------- */
function duplicateLayer(id){
  const target = layers.find(l => l.id === id);
  if (!target || layers.length >= MAX_LAYERS){ toast('最多 3 个图层'); return; }
  const newIndex = Math.max(...layers.map(l => l.index)) + 1;
  const copy = { ...target, id: 'layer-' + Date.now(), index: newIndex, zIndex: newIndex, x: target.x + 30, y: target.y + 30, name: target.name + ' 副本', imageSrc: target.imageSrc };
  layers.push(copy);
  loadImageForLayer(copy);
  syncCodeFromState('复制图层：' + copy.name);
  renderCanvas();
}
function deleteLayer(id){
  layers = layers.filter(l => l.id !== id);
  if (selectedLayerId === id) selectedLayerId = null;
  syncCodeFromState('删除图层');
  renderCanvas();
}
function bringFront(id){ const max = Math.max(...layers.map(l => l.zIndex)); layers = layers.map(l => l.id === id ? { ...l, zIndex: max + 1 } : l); syncCodeFromState('图层置顶'); renderCanvas(); }
function sendBack(id){ const min = Math.min(...layers.map(l => l.zIndex)); layers = layers.map(l => l.id === id ? { ...l, zIndex: min - 1 } : l); syncCodeFromState('图层置底'); renderCanvas(); }

/* ---------- 画布交互 ---------- */
function getCanvasCoords(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (CANVAS_W / r.width), y: (e.clientY - r.top) * (CANVAS_H / r.height) };
}
function hitTest(x, y){
  const sorted = [...layers].sort((a,b) => b.zIndex - a.zIndex);
  for (const layer of sorted){
    if (!layer.imageSrc) continue;
    const cx = layer.x + layer.width / 2, cy = layer.y + layer.height / 2;
    const dx = x - cx, dy = y - cy;
    const ang = -(layer.rotation * Math.PI) / 180;
    const rx = dx * Math.cos(ang) - dy * Math.sin(ang);
    const ry = dx * Math.sin(ang) + dy * Math.cos(ang);
    if (Math.abs(rx) <= layer.width / 2 && Math.abs(ry) <= layer.height / 2) return layer;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const { x, y } = getCanvasCoords(e);
  const hit = hitTest(x, y);
  if (hit){
    selectedLayerId = hit.id;
    dragging = { id: hit.id, sx: x, sy: y, ox: hit.x, oy: hit.y };
    canvas.style.cursor = 'grabbing';
  } else {
    selectedLayerId = null;
  }
  hideCtxMenu();
  renderCanvas();
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const { x, y } = getCanvasCoords(e);
  const layer = layers.find(l => l.id === dragging.id);
  if (!layer) return;
  layer.x = clamp(dragging.ox + (x - dragging.sx), -layer.width + 30, CANVAS_W - 30);
  layer.y = clamp(dragging.oy + (y - dragging.sy), -layer.height + 30, CANVAS_H - 30);
  renderCanvas();
});
window.addEventListener('mouseup', () => {
  if (dragging){
    dragging = null;
    canvas.style.cursor = 'crosshair';
    syncCodeFromState('调整图层位置');
  }
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const { x, y } = getCanvasCoords(e);
  const hit = hitTest(x, y);
  if (hit){
    selectedLayerId = hit.id;
    renderCanvas();
    showCtxMenu(e.clientX, e.clientY, hit.id);
  }
});

/* ---------- 右键菜单 ---------- */
function showCtxMenu(x, y, layerId){
  ctxMenu._id = layerId;
  ctxMenu.style.left = Math.min(x, window.innerWidth - 160) + 'px';
  ctxMenu.style.top = Math.min(y, window.innerHeight - 180) + 'px';
  ctxMenu.classList.add('show');
}
function hideCtxMenu(){ ctxMenu.classList.remove('show'); }
document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); });
ctxMenu.addEventListener('click', e => {
  const act = e.target.closest('.mi')?.dataset.act;
  const id = ctxMenu._id;
  if (!act || !id) return;
  if (act === 'dup') duplicateLayer(id);
  if (act === 'front') bringFront(id);
  if (act === 'back') sendBack(id);
  if (act === 'del') deleteLayer(id);
  hideCtxMenu();
});

/* ============================================================
 * 代码同步与历史
 * ============================================================ */
function syncCodeFromState(summary){
  currentCode = generateBatikCode(layers, globalConfig);
  editor.value = currentCode;
  codeError = null;
  codeBadge.className = 'badge ok';
  codeBadge.textContent = '语法正确';
  codeErr.style.display = 'none';
  if (summary) saveHistory(summary);
}

function applyCodeToState(code, silent){
  const result = parseBatikScript(code, layers);
  if (result.errors.length){
    codeError = result.errors.join('；');
    codeBadge.className = 'badge err';
    codeBadge.textContent = '语法错误';
    codeErr.textContent = '⚠ ' + codeError;
    codeErr.style.display = 'block';
    return;
  }
  codeError = null;
  codeBadge.className = 'badge ok';
  codeBadge.textContent = '语法正确';
  codeErr.style.display = 'none';
  layers = result.layers;
  globalConfig = result.globalConfig;
  if (!layers.find(l => l.id === selectedLayerId)) selectedLayerId = null;
  renderCanvas();
  if (!silent) saveHistory('手动修改代码');
}

function saveHistory(summary){
  codeHistory.push({ id: 'v-' + Date.now(), timestamp: Date.now(), code: currentCode, summary: summary || '代码变更' });
  if (codeHistory.length > 20) codeHistory = codeHistory.slice(-20);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(codeHistory)); } catch(e){}
  renderHistory();
}

function renderHistory(){
  const box = $('history-box');
  if (!codeHistory.length){
    box.innerHTML = '<div class="empty">暂无历史版本<br>修改代码或上传图片后将自动保存版本</div>';
    return;
  }
  box.innerHTML = '';
  [...codeHistory].reverse().forEach((v, idx) => {
    const real = codeHistory.length - 1 - idx;
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.innerHTML = '<div class="meta"><div class="time">v' + codeHistory.length + ' · ' + fmtTime(v.timestamp) + '</div><div class="sum">' + esc(v.summary) + '</div></div>' +
      '<button class="restore">恢复</button>';
    item.querySelector('.restore').addEventListener('click', () => restoreVersion(real));
    box.appendChild(item);
  });
}

function restoreVersion(idx){
  const v = codeHistory[idx];
  if (!v) return;
  currentCode = v.code;
  editor.value = v.code;
  applyCodeToState(v.code, true);
  saveHistory('回退到 ' + fmtTime(v.timestamp));
  toast('已恢复到该版本');
}

/* ---------- 代码编辑事件 ---------- */
let debounceTimer = null;
editor.addEventListener('input', () => {
  currentCode = editor.value;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => applyCodeToState(editor.value), 450);
});
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's'){
    e.preventDefault();
    clearTimeout(debounceTimer);
    applyCodeToState(editor.value);
    toast('代码已应用到画布');
  }
});
editor.addEventListener('blur', () => {
  clearTimeout(debounceTimer);
  applyCodeToState(editor.value);
});
$('copy-code-btn').addEventListener('click', () => {
  navigator.clipboard.writeText(currentCode).then(() => toast('代码已复制到剪贴板'), () => toast('复制失败'));
});

/* ============================================================
 * AI 对话（内置 BatikScript 语法引擎）

const WELCOME = '你好！我是蜡染工坊的AI助手。\n\n我可以把你想做的蜡染效果翻译成 BatikScript 语法代码并实时渲染到画布上。试试对我说：\n\n- "给这张图加冰裂纹，染深一点"\n- "把两张图螺旋融合"\n- "做一个浸染动画"\n- "画布底色改成靛蓝"\n\n也可以先在右上角上传或加载示例蜡染图案。';

function appendMsg(role, text){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (role === 'ai') b.classList.add('fading');
  b.innerHTML = text;
  wrap.appendChild(b);
  msgsBox.appendChild(wrap);
  msgsBox.scrollTop = msgsBox.scrollHeight;
  return wrap;
}

function renderAIText(text, note){
  const blocks = [];
  let t = text.replace(/```(?:batik)?\n?([\s\S]*?)```/g, (m, c) => { blocks.push(c.trim()); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  t = esc(t);
  t = t.replace(/\u0000(\d+)\u0000/g, (m, i) => '<pre class="ai-code">' + esc(blocks[+i]) + '</pre>');
  t = t.replace(/`([^`\n]+)`/g, '<code class="ai-inline">$1</code>');
  t = t.replace(/\n/g, '<br>');
  let html = t;
  if (note) html += '<div class="craft"><b>工艺 · </b>' + esc(note) + '</div>';
  return html;
}

function aiSay(text, note, applyFn, summary){
  appendMsg('ai', renderAIText(text, note));
  if (applyFn) applyFn();
  if (summary) syncCodeFromState(summary);
  renderCanvas();
}

    if (layers.length < 2){ aiSay('拼接融合需要至少两张蜡染素材，请再上传一张图片。', null); return; }
    allFx().forEach(fx => { fx.blendMode = '拼接'; });
    aiSay('已设置「拼接」融合模式，图案按各自位置组合成一幅新构图。\n\n```batik\n融合模式: 拼接;\n```', '拼接对应蜡染中的拼布传统，不同纹样的布片拼接成完整衣料，是节俭与美学的结合。', null, '设置拼接融合');
    return;
  }
  if (/叠印|融合|叠加|叠/.test(t)){
    if (layers.length < 2){ aiSay('融合效果需要至少两张蜡染素材。你可以先加载第二张示例图案，或再上传一张图片。', '多层蜡染通过多次画蜡、多次浸染叠出层次，素材越多，融合效果越丰富。'); return; }
    allFx().forEach(fx => { fx.blendMode = '叠印'; fx.opacity = 70; });
    aiSay('已设置「叠印」融合模式，模拟多层蜡叠染，上层镂空透出下层颜色。\n\n```batik\n融合模式: 叠印;\n透明度: 70;\n```', '叠印是最经典的蜡染组合方式：先画一层蜡染一层，再画一层再染，层层叠出丰富图案。', null, '设置叠印融合');
    return;
  }

  // 循环
  if (/循环/.test(t)){
    globalConfig.animationLoop = true;
    syncCodeFromState('开启动画循环');
    aiSay('已开启动画循环播放。\n\n```batik\n动画循环: 开启;\n```', null, null, null);
    return;
  }

  // 底色
  if (/底色|背景/.test(t)){
    let bg = null;
    if (/靛蓝/.test(t)) bg = '靛蓝';
    else if (/本白|白/.test(t)) bg = '本白';
    else if (/土黄|黄/.test(t)) bg = '土黄';
    if (bg){
      globalConfig.canvasBg = bg;
      syncCodeFromState('设置画布底色：' + bg);
      aiSay('已设置画布底色为「' + bg + '」。\n\n```batik\n画布底色: ' + bg + ';\n```', bg === '靛蓝' ? '靛蓝底是蜡染最常见的面貌，蓝白对比强烈、庄重典雅。' : '土布本色是米黄或本白，染后留白部分呈现布料原色。', null, null);
    } else {
      aiSay('画布底色支持：靛蓝、本白、土黄。例如说「底色改成靛蓝」。', null, null, null);
    }
    return;
  }

  // 大小
  if (/放大|变大|缩小|变小|大小/.test(t)){
    const scale = /放大|变大/.test(t) ? 1.25 : 0.8;
    layers.forEach(l => { l.width = Math.round(l.width * scale); l.height = Math.round(l.height * scale); });
    syncCodeFromState(scale > 1 ? '放大图层' : '缩小图层');
    aiSay('已' + (scale > 1 ? '放大' : '缩小') + '所有图层，大小由代码中的「大小: 宽, 高;」控制。\n\n```batik\n大小: ' + layers[0].width + ', ' + layers[0].height + ';\n```', null, null, null);
    return;
  }

  // 旋转
  if (/旋转|转一下|转 /.test(t)){
    layers.forEach(l => { l.rotation = (l.rotation + 15) % 360; });
    syncCodeFromState('旋转图层');
    aiSay('已旋转 15°，旋转角度由「旋转: 角度;」控制。\n\n```batik\n旋转: ' + layers[0].rotation + ';\n```', null, null, null);
    return;
  }

  // 移动
  if (/移动|位置|挪|靠/.test(t)){
    layers.forEach(l => { l.x = clamp(l.x + 30, 0, CANVAS_W - l.width); l.y = clamp(l.y + 30, 0, CANVAS_H - l.height); });
    syncCodeFromState('移动图层');
    aiSay('已微调图层位置。你也可以直接在画布上用鼠标拖拽图层到任意位置，代码会自动同步。\n\n```batik\n位置: ' + layers[0].x + ', ' + layers[0].y + ';\n```', null, null, null);
    return;
  }

  // 默认
  aiSay('我理解你的创作意图，但这条指令超出了当前语法引擎的词库。你可以试试：\n\n- "加冰裂纹" / "染深一点" / "染浅一点"\n- "增加晕染" / "画蜡笔触粗一点" / "点蜡密一点"\n- "两张图螺旋融合" / "叠印融合"\n- "做浸染动画" / "冰裂蔓延动画"\n- "底色改成靛蓝" / "开启循环"\n\n也可以在左下「语法手册」查看全部 BatikScript 指令，在「当前代码」手动修改后按 Ctrl+S 应用。', 'BatikScript 的每个关键字都对应一门真实工艺：画蜡、点蜡、浸染、冰裂。语法即非遗，修改即传承。', null, null);
}

function setAnim(type){
  if (!type) return;
  globalConfig.animation = type;
  if (type !== '无'){ isPlaying = false; animationProgress = 1; }
  syncCodeFromState('设置动画：' + type);
}

function updatePlaybackUI(){
  const hasAnim = globalConfig.animation !== '无';
  playbackBar.classList.toggle('show', hasAnim);
  if (hasAnim){
    animNameEl.textContent = globalConfig.animation + (globalConfig.animation === '浸染' ? '动画' : '');
    animPctEl.textContent = Math.round(animationProgress * 100) + '%';
    progressEl.value = Math.round(animationProgress * 100);
  }
}

function sendMessage(){
  const text = chatInput.value.trim();
  if (!text) return;
  appendMsg('user', esc(text).replace(/\n/g, '<br>'));
  chatInput.value = '';
  sendBtn.disabled = true;
  chatInput.disabled = true;
  setTimeout(() => { handleIntent(text); sendBtn.disabled = false; chatInput.disabled = false; chatInput.focus(); }, 350);
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

/* ============================================================
 * 播放控制
 * ============================================================ */
function togglePlay(){
  if (!layers.length){ toast('请先上传图片再播放动画'); return; }
  if (globalConfig.animation === '无'){ toast('当前无动画，可在代码中加入「动画: 浸染」等指令'); return; }
  if (isPlaying){
    isPlaying = false;
    cancelAnimationFrame(raf);
    setPlayIcon();
    return;
  }
  if (animationProgress >= 1) animationProgress = 0;
  isPlaying = true;
  setPlayIcon();
  let last = performance.now();
  const tick = now => {
    if (!isPlaying) return;
    const dt = (now - last) / 1000; last = now;
    animationProgress = Math.min(1, animationProgress + dt * globalConfig.animationSpeed * 0.12);
    renderCanvas();
    if (animationProgress >= 1){
      if (globalConfig.animationLoop){ animationProgress = 0; raf = requestAnimationFrame(tick); return; }
      isPlaying = false; setPlayIcon(); return;
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function setPlayIcon(){
  playIcon.innerHTML = isPlaying
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<polygon points="6 3 20 12 6 21 6 3"/>';
}
$('play-btn').addEventListener('click', togglePlay);
$('restart-btn').addEventListener('click', () => { isPlaying = false; cancelAnimationFrame(raf); animationProgress = 0; renderCanvas(); toast('已回到起始帧'); });
progressEl.addEventListener('input', () => {
  isPlaying = false; cancelAnimationFrame(raf); setPlayIcon();
  animationProgress = progressEl.value / 100;
  renderCanvas();
});
loopSwitch.addEventListener('click', () => {
  globalConfig.animationLoop = !globalConfig.animationLoop;
  loopSwitch.classList.toggle('on', globalConfig.animationLoop);
  loopSwitch.setAttribute('aria-checked', globalConfig.animationLoop);
  syncCodeFromState(globalConfig.animationLoop ? '开启循环' : '关闭循环');
  toast(globalConfig.animationLoop ? '循环播放已开启' : '循环播放已关闭');
});
$('screenshot-btn').addEventListener('click', () => {
  if (!layers.length){ toast('画布还没有内容'); return; }
  const a = document.createElement('a');
  a.download = '蜡染截屏_' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('已保存当前帧');
});

/* ============================================================
 * 工具栏
 * ============================================================ */
$('upload-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => handleFiles(e.target.files));
$('reset-btn').addEventListener('click', () => {
  layers = []; globalConfig = { ...DEFAULT_GLOBAL };
  selectedLayerId = null; isPlaying = false; animationProgress = 1;
  cancelAnimationFrame(raf); setPlayIcon();
  syncCodeFromState('画布重置');
  renderCanvas();
  toast('画布已重置');
});
$('export-img-btn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = '蜡染作品_' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('图片已导出');
});
$('code-drop-btn').addEventListener('click', e => openMenu(e.currentTarget, [
  { label: '下载 .batik 文件', act: () => {
      const blob = new Blob([currentCode], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.download = '蜡染代码_' + Date.now() + '.batik';
      a.href = URL.createObjectURL(blob);
      a.click();
      URL.revokeObjectURL(a.href);
      toast('代码文件已下载');
    } },
  { label: '复制到剪贴板', act: () => navigator.clipboard.writeText(currentCode).then(() => toast('已复制'), () => toast('复制失败')) },
]));
$('sample-btn').addEventListener('click', e => openMenu(e.currentTarget, [
  { label: '示例一 · 花鸟纹样', act: () => loadSample(0) },
  { label: '示例二 · 螺旋几何纹', act: () => loadSample(1) },
]));

/* ---------- 通用下拉菜单 ---------- */
let menuOpen = false;
let menuAnchor = null;
function openMenu(anchor, items){
  closeMenu();
  menuAnchor = anchor;
  menu.innerHTML = '';
  items.forEach(it => {
    const mi = document.createElement('div');
    mi.className = 'mi';
    mi.textContent = it.label;
    mi.addEventListener('click', () => { closeMenu(); it.act(); });
    menu.appendChild(mi);
  });
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
  menu.style.top = (r.bottom + 6) + 'px';
  menu.classList.add('show');
  menuOpen = true;
}
function closeMenu(){ menu.classList.remove('show'); menuOpen = false; }
document.addEventListener('click', e => { if (menuOpen && !menu.contains(e.target) && !(menuAnchor && menuAnchor.contains(e.target))) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMenu(); hideCtxMenu(); } });

/* ============================================================
 * 语法手册渲染
 * ============================================================ */
function renderManual(){
  const box = $('manual-box');
  const groups = {};
  SYNTAX_ITEMS.forEach(it => { (groups[it.category] = groups[it.category] || []).push(it); });
  const catName = { layer: '图层属性', effect: '蜡染效果', global: '全局配置' };
  let html = '';
  Object.entries(groups).forEach(([cat, items]) => {
    html += '<div class="cat"><h4>' + (catName[cat] || cat) + '</h4>';
    items.forEach(it => {
      html += '<div class="item" data-craft="' + esc(it.craftExplain) + '">' +
        '<div class="top"><span class="name">' + esc(it.name) + '</span><span class="params">' + esc(it.params.join(' · ')) + '</span></div>' +
        '<pre>' + esc(it.example) + '</pre></div>';
    });
    html += '</div>';
  });
  box.innerHTML = html;
  box.querySelectorAll('.item').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tip.textContent = el.dataset.craft;
      const r = el.getBoundingClientRect();
      tip.style.left = Math.min(r.right + 10, window.innerWidth - 312) + 'px';
      tip.style.top = Math.max(8, r.top) + 'px';
      tip.classList.add('show');
    });
    el.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
}

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    ['manual','code','history'].forEach(t => $('panel-' + t).classList.toggle('hidden', t !== btn.dataset.tab));
  });
});

/* ---------- 初始化 ---------- */
function init(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved){ const arr = JSON.parse(saved); if (Array.isArray(arr)) codeHistory = arr.slice(-20); }
  } catch(e){}
  renderManual();
  renderHistory();
  currentCode = getDefaultCode();
  editor.value = currentCode;
  appendMsg('ai', renderAIText(WELCOME, '蜡染是国家级非物质文化遗产，本工坊以「语法即非遗」为理念：每个代码关键字都对应真实蜡染工艺。'));
  renderCanvas();
}
init();
